set_week_profile:
  target:
    entity:
      integration: cul
      domain: climate
  fields:
    profile:
      required: true
      example: |
        monday:
          - from: "06:00"
            to: "08:30"
            temperature: 21
          - from: "17:00"
            to: "22:00"
            temperature: 21
      selector:
        object:
    base_temperature:
      default: 17
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          unit_of_measurement: "°C"

get_week_profile:
  target:
    entity:
      integration: cul
      domain: climate

set_temporary_temperature:
  target:
    entity:
      integration: cul
      domain: climate
  fields:
    temperature:
      required: true
      selector:
        number:
          min: 4.5
          max: 30.5
          step: 0.5
          unit_of_measurement: "°C"
    until:
      required: true
      selector:
        datetime:

set_group:
  target:
    entity:
      integration: cul
      domain: climate
  fields:
    group:
      required: true
      selector:
        number:
          min: 0
          max: 255
          mode: box
